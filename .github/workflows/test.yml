name: 'Test'

on:
    pull_request:
    push:
        branches: ['main']

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Use PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'

            - name: Install dependencies
              run: |
                  npm install
                  composer install

            - name: Lint
              run: |
                  npm run lint:css
                  npm run lint:js
                  composer run-script lint:php

            - name: Unit tests (JS)
              run: npm run test:unit

            - name: Unit tests (PHP)
              run: composer run-script test:php

    # Integration and e2e tests against a real WordPress installation (wp-env),
    # across all PHP versions the plugin supports.
    wp-env:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
        env:
            WP_ENV_PHP_VERSION: ${{ matrix.php }}
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Use PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '${{ matrix.php }}'

            - name: Install dependencies
              run: |
                  npm ci
                  composer install

            - name: Build plugin
              run: npm run build

            - name: Install Playwright browser
              run: npx playwright install chromium --with-deps

            - name: Start WordPress
              run: npx wp-env start

            - name: Integration tests (PHP)
              run: npm run test:php:integration

            - name: E2e tests
              run: npm run test:e2e

            - name: Upload Playwright artifacts
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-artifacts-php${{ matrix.php }}
                  path: |
                      tests/e2e/artifacts/test-results
                      tests/e2e/artifacts/report
                  if-no-files-found: ignore

    # Warn when the committed .po files no longer match the strings in the
    # source code.
    i18n:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: Use PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  tools: wp-cli

            - name: Install dependencies
              run: npm ci

            - name: Install gettext
              run: sudo apt-get update && sudo apt-get install -y gettext

            - name: Regenerate .pot from source
              run: npm run i18n:pot

            - name: Check .po files are up to date
              run: |
                  POT=languages/fame_lahjoitukset.pot
                  stale=0
                  for po in languages/*.po; do
                      # msgcmp compares only the msgid set (ignoring locations
                      # and ordering) and exits non-zero when they diverge.
                      if ! out=$(msgcmp --use-untranslated "$po" "$POT" 2>&1); then
                          stale=1
                          echo "::warning file=$po::$po is out of date with the source strings. Run 'npm run i18n:pot', then merge with 'msgmerge -U $po $POT'."
                          {
                              echo "### ⚠️ \`$po\` is out of date"
                              echo ''
                              echo '```'
                              echo "$out"
                              echo '```'
                          } >> "$GITHUB_STEP_SUMMARY"
                      fi
                  done
                  if [ "$stale" -eq 0 ]; then
                      echo "✅ All .po files are up to date with the source strings." >> "$GITHUB_STEP_SUMMARY"
                  fi
                  # Warning only — never fail the build.
                  exit 0
